name: CI/CD Deploy

on:
  push:
    branches: [main]

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1. Test ───────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('itsm-backend/**/*.gradle*', 'itsm-backend/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Backend Test
        working-directory: itsm-backend
        run: ./gradlew test --no-daemon

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: itsm-frontend/package-lock.json

      - name: Frontend Install
        working-directory: itsm-frontend
        run: npm ci

      - name: Frontend Security Audit
        working-directory: itsm-frontend
        run: npm audit --audit-level=high

      - name: Frontend Test
        working-directory: itsm-frontend
        run: npm run test:run

  # ── 2. Build & Push Docker Images ────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('itsm-backend/**/*.gradle*', 'itsm-backend/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build Backend JARs
        working-directory: itsm-backend
        run: ./gradlew :itsm-api:bootJar :itsm-batch:bootJar --no-daemon -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push itsm-api
        uses: docker/build-push-action@v5
        with:
          context: itsm-backend
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/itsm-api:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USER }}/itsm-api:latest
          build-args: MODULE=itsm-api

      - name: Build & Push itsm-batch
        uses: docker/build-push-action@v5
        with:
          context: itsm-backend
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/itsm-batch:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USER }}/itsm-batch:latest
          build-args: MODULE=itsm-batch

      - name: Build & Push itsm-frontend
        uses: docker/build-push-action@v5
        with:
          context: itsm-frontend
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/itsm-frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USER }}/itsm-frontend:latest

      # Container image vulnerability scanning
      - name: Scan itsm-api image (Trivy)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ env.DOCKER_USER }}/itsm-api:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Scan itsm-frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ env.DOCKER_USER }}/itsm-frontend:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ── 3. Deploy to Server ──────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml,deploy/nginx-itsm.conf,fail2ban/"
          target: ~/itsm

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/itsm

            # .env 파일 생성/갱신
            cat > .env <<'ENVEOF'
DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
DB_PASSWORD=${{ secrets.DB_PASSWORD }}
JWT_SECRET=${{ secrets.JWT_SECRET }}
CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
IMAGE_TAG=${{ github.sha }}
ENVEOF

            # 호스트 nginx 설정 (최초 1회만 복사)
            NGINX_CONF=/etc/nginx/conf.d/itsm.conf
            if [ ! -f "$NGINX_CONF" ]; then
              sudo cp deploy/nginx-itsm.conf "$NGINX_CONF"

              # SSL 인증서 발급 (certbot)
              DOMAIN=${{ secrets.DOMAIN }}
              if ! sudo certbot certificates 2>/dev/null | grep -q "$DOMAIN"; then
                sudo certbot certonly --nginx -d "$DOMAIN" --non-interactive --agree-tos -m ${{ secrets.CERTBOT_EMAIL }}
              fi

              sudo nginx -t && sudo systemctl reload nginx
            fi

            # 배포 전 DB 백업
            echo "==> DB backup before deploy..."
            BACKUP_FILE=~/itsm/backup/itsm_$(date +%Y%m%d_%H%M%S).sql.gz
            mkdir -p ~/itsm/backup
            docker compose exec -T db mariadb-dump -u root -p"${{ secrets.DB_PASSWORD }}" ITSM | gzip > "$BACKUP_FILE" || echo "WARNING: DB backup failed"
            # 최근 7개 백업만 보관
            ls -t ~/itsm/backup/itsm_*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm

            # 현재 이미지 태그 저장 (롤백용)
            PREV_TAG=$(grep IMAGE_TAG .env.prev 2>/dev/null | cut -d= -f2 || echo "")
            cp .env .env.prev

            # 최신 이미지 pull & 재시작
            docker compose pull
            docker compose up -d --remove-orphans

            # 헬스체크 검증 (최대 90초 대기)
            echo "==> Waiting for health check..."
            HEALTHY=false
            for i in $(seq 1 18); do
              sleep 5
              # 호스트에서 프론트엔드(8084) 경유 API 호출
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8084/api/v1/auth/health 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" != "000" ] && [ "$HTTP_CODE" != "502" ] && [ "$HTTP_CODE" != "503" ]; then
                echo "==> API is healthy! (HTTP $HTTP_CODE)"
                HEALTHY=true
                break
              fi
              echo "==> Attempt $i/18: API not ready yet (HTTP $HTTP_CODE)..."
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "==> ERROR: Health check failed! Rolling back..."
              if [ -n "$PREV_TAG" ]; then
                sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=$PREV_TAG/" .env
                docker compose pull
                docker compose up -d --remove-orphans
                echo "==> Rolled back to $PREV_TAG"
              fi
              exit 1
            fi

            # 정상 배포 완료 - 이전 이미지 정리
            docker image prune -f
            echo "==> Deploy complete: ${{ github.sha }}"
