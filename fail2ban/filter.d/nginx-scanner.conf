[Definition]
# 444 응답 (nginx에서 silent drop한 요청) 감지
# 로그 형식은 nginx 기본 combined: <ip> - <user> [<date>] "<request>" <status> <bytes> "<referer>" "<ua>"
# fail2ban 은 날짜 부분을 잘라낸 뒤 매칭하므로 [] 안은 비어 있을 수도, 남아 있을 수도 있다 → \[[^\]]*\]
# 구버전 정규식 `.*" (GET|POST) .* 444` 는 따옴표 뒤 공백을 요구해 실제 로그와 한 번도 매칭되지 않았다 (2026-09-16 전수조사 P7).
failregex = ^<HOST> - \S+ \[[^\]]*\] "[^"]*" 444 \d+
            ^<HOST> - \S+ \[[^\]]*\] "[^"]*" 403 0
ignoreregex =
