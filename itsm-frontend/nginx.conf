# Rate limiting zone (10MB shared memory, 10 requests/sec per IP)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Block bad user agents
map $http_user_agent $bad_agent {
    default 0;
    "~*scanner"        1;
    "~*bot"            1;
    "~*crawl"          1;
    "~*spider"         1;
    "~*nikto"          1;
    "~*sqlmap"         1;
    "~*nmap"           1;
    "~*masscan"        1;
    "~*dirbuster"      1;
    "~*gobuster"       1;
    "~*wfuzz"          1;
    "~*nuclei"         1;
    "~*zgrab"          1;
    "~*httpx"          1;
    "~*curl/"          1;
    "~*wget/"          1;
    "~*python-requests" 1;
    "~*go-http-client" 1;
    "~*visionheight"   1;
    ""                 1;
}

server {
    listen 80;
    server_name _;

    # 실제 클라이언트 IP 복원 (2026-09-16 전수조사 P7)
    # 이 컨테이너는 호스트 nginx(127.0.0.1:8084 프록시)만 접근하므로 $remote_addr 이 늘 도커 게이트웨이 IP 였다.
    # → limit_req 가 전체 사용자 공용 버킷이 되고, fail2ban 은 게이트웨이 IP 를 밴해 효과가 0 이었다.
    # 호스트 nginx 가 X-Real-IP 를 세팅하므로(deploy/nginx-itsm.conf) 도커 브리지 대역에서 온 요청만 신뢰한다.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # Log to files (for fail2ban monitoring)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    root /usr/share/nginx/html;
    index index.html;

    # --- 1단계: 기본 보안 ---

    # Block bad user agents (444 = silent drop)
    if ($bad_agent) {
        return 444;
    }

    # Allowed HTTP methods only
    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) {
        return 444;
    }

    # Request size limit (10MB)
    client_max_body_size 10m;

    # Hide nginx version
    server_tokens off;

    # --- 스캐너가 탐색하는 경로 즉시 차단 ---
    # 주의: Vue 라우트(router/routes/*.js)와 겹치면 새로고침·딥링크가 444 로 끊긴다.
    #   `admin` 은 /admin/* 관리자 화면 8개와 충돌해 제거(2026-09-16 전수조사 P7). 스캐너 프로브는 대부분 .php 확장자 차단에 걸린다.
    location ~* ^/(administrator|wp-admin|wp-login|wp-content|wp-includes|wordpress|phpmyadmin|pma|myadmin|mysql|cgi-bin|\.env|\.git|\.svn|\.htaccess|\.htpasswd|phpinfo|info\.php|server-status|server-info|xmlrpc\.php|eval-stdin|shell|console|joomla|magento|drupal|vendor|telescope|debug|elmah|trace\.axd|dana-cached|fog|Account/Login|rest/applinks|magento_version|cluster/list|ext-js|language/en-GB) {
        access_log off;
        return 444;
    }

    # Block common probe file extensions
    location ~* \.(asp|aspx|jsp|cgi|php|sql|bak|old|orig|save|swp|tmp|dist|config)$ {
        access_log off;
        return 444;
    }

    # --- Vue Router history mode ---
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /index.html;

        # Security Headers (정적 파일 전용)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Spring Security 쪽(SecurityConfig)은 DISABLED(=0) — 구형 XSS 필터는 오히려 취약점 소지가 있어 양쪽을 0 으로 통일
        add_header X-XSS-Protection "0" always;
    }

    # --- API reverse proxy ---
    # 보안 헤더는 Spring Security가 처리, nginx는 upstream 응답(CORS 포함)을 그대로 전달
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://itsm-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger - blocked in production (access via localhost only for debugging)
    location ~* ^/(swagger-ui|v3/api-docs) {
        return 404;
    }

    # --- gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
