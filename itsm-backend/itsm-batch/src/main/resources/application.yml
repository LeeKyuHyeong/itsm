# 웹 서버 없음(spring-boot-starter-web 미포함) — 스케줄러 전용 프로세스.
# Spring Batch 스타터는 2026-09-16 P4 에서 제거: Job/Step 추상화를 쓰지 않았고 initialize-schema=always 가 운영 DB 에 BATCH_* 메타 테이블만 만들고 있었다.

spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false


# ITSM
itsm:
  system-user-id: ${SYSTEM_USER_ID:1}
