spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ITSM?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

jwt:
  secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktc2VjcmV0LWtleS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudC0xMjM0NTY3ODkw}

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
