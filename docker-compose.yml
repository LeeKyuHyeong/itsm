services:
  db:
    image: mariadb:11.7.2
    container_name: itsm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ITSM
      TZ: Asia/Seoul
    # localhost 전용 (2026-07-24, DB 포트 전면 노출 사고 예방) — 외부는 SSH 터널로. 0.0.0.0 금지.
    ports:
      - "127.0.0.1:3310:3306"
    # 메모리 튜닝 (2026-07-24, 4GB VPS 공유 환경): 실사용 대비 과한 기본값 축소
    command:
      - --innodb-buffer-pool-size=96M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - itsm-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -u root -p\"$$MARIADB_ROOT_PASSWORD\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  itsm-api:
    image: ${DOCKERHUB_USERNAME}/itsm-api:${IMAGE_TAG:-latest}
    container_name: itsm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      DB_HOST: db:3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    expose:
      - "8080"
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  itsm-batch:
    image: ${DOCKERHUB_USERNAME}/itsm-batch:${IMAGE_TAG:-latest}
    container_name: itsm-batch
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul  # 배치 실행 시각 기준 — UTC 면 스케줄이 9시간 어긋남
      DB_HOST: db:3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  itsm-frontend:
    image: ${DOCKERHUB_USERNAME}/itsm-frontend:${IMAGE_TAG:-latest}
    container_name: itsm-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul  # nginx 액세스 로그 시각 (fail2ban 필터 기준 시각과 일치 필요)
    depends_on:
      - itsm-api
    ports:
      - "127.0.0.1:8084:80"  # 앱 포트는 localhost 전용(호스트 nginx 프록시만 접근, SSOT §0)
    volumes:
      - nginx-logs:/var/log/nginx
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: itsm-fail2ban
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul  # 로그 파싱·밴 만료 시각이 nginx 로그 시각과 같은 존이어야 함
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - nginx-logs:/var/log/nginx:ro
      - ./fail2ban/jail.local:/etc/fail2ban/jail.local:ro
      - ./fail2ban/filter.d:/etc/fail2ban/filter.d:ro
      - fail2ban-data:/var/lib/fail2ban
    depends_on:
      - itsm-frontend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  itsm-db-data:
  nginx-logs:
  fail2ban-data:
