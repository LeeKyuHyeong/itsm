services:
  db:
    image: mariadb:11
    container_name: itsm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ITSM
      TZ: Asia/Seoul
    ports:
      - "3310:3306"
    volumes:
      - itsm-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -u root -p\"$$MARIADB_ROOT_PASSWORD\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  itsm-api:
    image: ${DOCKERHUB_USERNAME}/itsm-api:latest
    container_name: itsm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db:3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    expose:
      - "8080"

  itsm-batch:
    image: ${DOCKERHUB_USERNAME}/itsm-batch:latest
    container_name: itsm-batch
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db:3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

  itsm-frontend:
    image: ${DOCKERHUB_USERNAME}/itsm-frontend:latest
    container_name: itsm-frontend
    restart: unless-stopped
    depends_on:
      - itsm-api
    ports:
      - "8084:80"
    volumes:
      - nginx-logs:/var/log/nginx

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: itsm-fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - nginx-logs:/var/log/nginx:ro
      - ./fail2ban/jail.local:/etc/fail2ban/jail.local:ro
      - ./fail2ban/filter.d:/etc/fail2ban/filter.d:ro
      - fail2ban-data:/var/lib/fail2ban
    depends_on:
      - itsm-frontend

volumes:
  itsm-db-data:
  nginx-logs:
  fail2ban-data:
